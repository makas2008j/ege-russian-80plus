<html lang="ru">

<title>ЕГЭ Русский язык — План 80+</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--hover:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--success:#10b981;--border:#334155}
[data-theme="light"]{--bg:#f1f5f9;--card:#fff;--hover:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--success:#059669;--border:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px;min-height:100vh}
.container{max-width:760px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:8px 0;border-bottom:1px solid var(--border)}
h1{font-size:19px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#1d4ed8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn,.btn-small,.btn-main,.tab-btn{cursor:pointer}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:12px;font-weight:600}
.progress-card,.week-card,.card-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.progress-header{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.progress-bar-bg{background:var(--border);height:9px;border-radius:9px;overflow:hidden}
.progress-bar-fill{height:100%;width:0;background:linear-gradient(135deg,#3b82f6,#1d4ed8);transition:.35s}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--border);margin-bottom:16px}
.tab-btn{background:transparent;border:0;color:var(--muted);padding:9px 3px;font-size:12px;font-weight:700;border-radius:10px}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-content{display:none} .tab-content.active{display:block}
.week-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.week-title{font-size:15px;font-weight:800}
.week-target{font-size:11px;background:rgba(59,130,246,.15);color:var(--accent);padding:4px 7px;border-radius:7px;font-weight:800;white-space:nowrap}
.week-details{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 11px}
.week-actions{display:flex;gap:7px;flex-wrap:wrap}
.btn-small{background:var(--accent);color:#fff;border:0;padding:8px 10px;border-radius:9px;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn-secondary{background:var(--hover);color:var(--text)}
.checkbox-container{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-left:auto;cursor:pointer}
.checkbox-container input{display:none}
.custom-checkbox{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center}
.checkbox-container input:checked~.custom-checkbox{background:var(--success);border-color:var(--success)}
.checkbox-container input:checked~.custom-checkbox::after{content:"✓";color:#fff;font-weight:900;font-size:11px}
.select-box{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:10px;font-size:13px;margin:8px 0 10px}
.btn-main{width:100%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:0;padding:12px;border-radius:12px;font-size:14px;font-weight:800}
.task-list{max-height:520px;overflow-y:auto;margin-top:12px}
.task-item{background:var(--bg);padding:12px;border-radius:11px;border:1px solid var(--border);margin-bottom:8px}
.task-title{font-size:13px;font-weight:800;margin-bottom:4px}
.task-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:9px}
.source-badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:6px;background:rgba(16,185,129,.13);color:var(--success);font-weight:800;margin-bottom:7px}
.routine-row{background:var(--bg);padding:9px;border-radius:9px;margin-bottom:7px;border:1px solid var(--border);font-size:12px}
.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
.video-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:1000;justify-content:center;align-items:center;padding:12px}
.video-content{background:var(--card);width:100%;max-width:760px;border-radius:18px;overflow:hidden;border:1px solid var(--border)}
.video-head{padding:12px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);font-weight:800}
.video-wrap{position:relative;width:100%;padding-bottom:56.25%;background:#000}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-foot{padding:12px;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg)}
@media(max-width:500px){.container{max-width:420px}.week-target{font-size:10px}}

.task-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.task-btn{padding:12px 8px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;text-align:left}.task-btn:hover{border-color:#6b7cff}.task-btn b{display:block;font-size:18px}.task-btn span{font-size:11px;color:var(--muted)}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:12px;margin-top:4px}.quiz-progress-bg{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:14px 0}.quiz-progress-bg>div{height:100%;width:0;background:#6b7cff;transition:.2s}.q-title{font-size:17px;line-height:1.5;margin:18px 0}.q-option{display:block;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--bg)}.q-option:hover{border-color:#6b7cff}.q-option.selected{border-color:#6b7cff;background:rgba(107,124,255,.12)}.q-option input{margin-right:8px}.quiz-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.answer-review{padding:12px;border-radius:12px;margin-top:10px;border:1px solid var(--border)}.answer-review.ok{border-color:#42b883}.answer-review.bad{border-color:#e57373}.result-score{font-size:34px;font-weight:800;margin:8px 0}@media(max-width:650px){.task-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.task-grid{grid-template-columns:repeat(2,1fr)}}
/* ===== iPhone 13 / iOS mobile adaptation ===== */
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100svh;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button,a,label{ -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{font:inherit;}
button{touch-action:manipulation;}
.container{width:100%;max-width:760px;padding:12px 14px 24px;margin:0 auto;}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -14px 14px;padding:calc(8px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--border);}
h1{font-size:18px;line-height:1.2;}
.icon-btn{min-height:44px;min-width:44px;padding:9px 12px;}
.progress-card,.week-card,.card-section{border-radius:18px;padding:15px;margin-bottom:12px;}
.tabs{position:sticky;top:62px;z-index:19;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:4px;margin:0 -2px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.tab-btn{min-height:44px;padding:8px 2px;font-size:12px;}
.week-top{gap:10px;}
.week-title{font-size:15px;line-height:1.3;}
.week-target{font-size:10px;}
.week-details{font-size:13px;line-height:1.5;}
.week-actions{gap:8px;}
.btn-small{min-height:44px;padding:10px 12px;font-size:12px;border-radius:11px;}
.checkbox-container{min-height:44px;}
.custom-checkbox{width:22px;height:22px;}
.select-box{min-height:46px;font-size:16px;}
.btn-main{min-height:48px;font-size:15px;border-radius:13px;}
.task-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
.task-btn{min-height:92px;padding:13px 11px;border-radius:14px;}
.task-btn b{font-size:20px;}
.task-btn span{font-size:11px;line-height:1.3;display:block;margin-top:2px;}
.quiz-head{position:sticky;top:0;z-index:10;background:var(--card);padding-bottom:8px;}
.q-title{font-size:18px;line-height:1.45;margin:18px 0 14px;}
.q-option{min-height:52px;padding:14px 13px;margin:9px 0;font-size:16px;line-height:1.35;display:flex;align-items:flex-start;gap:7px;}
.q-option input{width:20px;height:20px;flex:0 0 auto;margin:0;accent-color:var(--accent);}
.quiz-nav{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:12;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:14px -15px -15px;padding:10px 15px calc(10px + env(safe-area-inset-bottom));}
.quiz-nav .btn-small,.quiz-nav .btn-main{width:48%;}
.result-score{font-size:38px;}
.answer-review{font-size:14px;line-height:1.45;padding:13px;}
.video-modal{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);align-items:center;}
.video-content{width:100%;max-width:none;border-radius:20px 20px 0 0;max-height:100svh;overflow:auto;}
.video-head{min-height:56px;padding:10px 14px;}
.video-wrap{padding-bottom:56.25%;}
.video-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
.notice{font-size:12px;}
.routine-row{font-size:13px;line-height:1.45;padding:11px;}
@media (max-width:430px){
  .container{padding-left:13px;padding-right:13px;}
  .tabs{top:60px;}
  .tab-btn{font-size:11px;}
  .week-top{display:block;}
  .week-target{display:inline-block;margin-top:7px;}
  .week-actions .btn-small{flex:1 1 calc(50% - 8px);justify-content:center;}
}
@media (min-width:431px){.task-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (orientation:landscape) and (max-height:500px){
  .container{max-width:900px;}
  .video-content{max-height:100svh;}
}

<body data-theme="dark">
<div class="container">
<header><h1>ЕГЭ Русский • 80+</h1><button class="icon-btn" onclick="toggleTheme()">☀️ / 🌙</button></header>

<div class="progress-card">
<div class="progress-header"><span>Общий прогресс</span><span id="progress-text">0 / 28 недель</span></div>
<div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
</div>

<div class="tabs">

<button class="tab-btn" onclick="switchTab('trainer',this)">Тренажер</button>
<button class="tab-btn" onclick="switchTab('routine',this)">Режим</button>
<button class="tab-btn" onclick="switchTab('progress',this)">Прогресс</button>

<section id="tab-plan" class="tab-content active"><div id="weeks-list"></div></section>

<section id="tab-trainer" class="tab-content">

</div>
<div class="card-section" id="quiz-card" style="display:none">

</div>
<div class="card-section" id="quiz-result" style="display:none"></div>
</section>

<section id="tab-routine" class="tab-content"><div class="card-section"><h3>Режим недели</h3><div id="routine-list"></div></div></section>
<section id="tab-progress" class="tab-content"><div class="card-section"><h3>История тестов</h3><div id="history-list">Пока нет тестов.</div></div></section>
</div>

<div class="video-modal" id="videoModal">
<div class="video-content">
<div class="video-head"><span id="modalVideoTitle">Видеоурок</span><button class="icon-btn" onclick="closeVideoModal()">✕</button></div>
<div class="video-wrap" id="videoWrap"></div>
<div class="video-foot">
<button class="btn-small" onclick="playYouTube()">▶ YouTube</button>
<label class="btn-small btn-secondary">📂 Файл<input id="videoFile" type="file" accept="video/*" style="display:none" onchange="saveLocalVideo(event)"></label>
</div>
</div>

const rawExcelPlan = [{"period": "Ноябрь • Нед. 1", "target": "10–20 → 25+", "topics": "База; №9: корни", "yt": "Вся теория по русскому перед 11 классом\nhttps://www.youtube.com/watch?v=qXpmDiyGOTQ\n\n№9: Правописание корней\nhttps://www.youtube.com/watch?v=ZgtD1DHQKFE", "practice": "№9: 30–40 заданий", "control": "Мини-тест №9"}, {"period": "Ноябрь • Нед. 2", "target": "25–30", "topics": "№10–11: приставки, суффиксы", "yt": "Орфография 9–15\nhttps://www.youtube.com/watch?v=A5N7cKURIS0\n\n№11: Правописание суффиксов\nhttps://www.youtube.com/watch?v=ZOWDAzDfiPs", "practice": "№10–11: по 30 заданий", "control": "Тест №9–11"}, {"period": "Ноябрь • Нед. 3", "target": "30–35", "topics": "№12–13: глаголы, причастия, НЕ", "yt": "Орфография 9–15\nhttps://www.youtube.com/watch?v=A5N7cKURIS0", "practice": "№12–13: по 30 заданий", "control": "Тест №9–13"}, {"period": "Ноябрь • Нед. 4", "target": "35–40", "topics": "№14–15: слитное/раздельное, Н/НН", "yt": "Орфография 9–15\nhttps://www.youtube.com/watch?v=A5N7cKURIS0", "practice": "№14–15: по 30 заданий", "control": "Мини-вариант 1–15"}, {"period": "Декабрь • Нед. 1", "target": "40–45", "topics": "№7: морфологические нормы", "yt": "Задание 7: Морфологические нормы\nhttps://www.youtube.com/watch?v=OXl994SN8ww", "practice": "№7: 30–40 заданий", "control": "Тест №7"}, {"period": "Декабрь • Нед. 2", "target": "45–50", "topics": "№8: грамматические нормы", "yt": "Задание 8: как избежать ошибок\nhttps://www.youtube.com/watch?v=11UapqZfAvE", "practice": "№8: 30–40 заданий", "control": "Тест №7–8"}, {"period": "Декабрь • Нед. 3", "target": "50–55", "topics": "№16–18: базовая пунктуация", "yt": "Пунктуация 16–21\nhttps://www.youtube.com/watch?v=_kRe3oM3IVE", "practice": "№16–18: по 25–30 заданий", "control": "Мини-вариант 7–18"}, {"period": "Декабрь • Нед. 4", "target": "55–60", "topics": "№19–21: сложные предложения", "yt": "Пунктуация 16–21\nhttps://www.youtube.com/watch?v=_kRe3oM3IVE", "practice": "№19–21: по 25–30 заданий", "control function switchTab(id,btn) {
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active'); btn.classList.add('active');
}
function toggleTheme() {
  document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='dark'?'light':'dark');
}
function renderWeeks() {
  const el=document.getElementById('weeks-list'); el.innerHTML='';
  rawExcelPlan.forEach((w,i)=>{
    const checked=completedWeeks[i]?'checked':'';
    const video=w.yt ? 'Есть' : 'Нет';
    el.insertAdjacentHTML('beforeend',`
      <div class="week-card">
        <div class="week-top"><div class="week-title">${esc(w.period)}</div><div class="week-target">${esc(w.target)}</div></div>
        <div class="week-details">
          <b>Темы:</b> ${esc(w.topics)}<br>
          <b>Что смотреть:</b> ${esc(cleanVideoText(w.yt))}<br>
          <b>Практика:</b> ${esc(w.practice)}<br>
          <b>Контроль:</b> ${esc(w.control)}<br>
          <b>Видео:</b> ${video==='Есть'?'✅':'—'}
        </div>
        <div class="week-actions">
          ${w.yt ? `<button class="btn-small" onclick="openVideo(${i})">▶ Видео</button>` : ''}
          <a class="btn-small btn-secondary" href="${sdamgiaBase}" target="_blank">📚 Банк Решу ЕГЭ</a>
          <a class="btn-small btn-secondary" href="${fipiBankUrl}" target="_blank">🏛 ФИПИ</a>
          <label class="checkbox-container"><input type="checkbox" ${checked} onchange="toggleWeek(${i},this)"><span class="custom-checkbox"></span><span>Пройдено</span></label>
        </div>
      </div>`);
  });
}
function cleanVideoText(s) { return (s||'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim() || 'Теория по теме'; }
function esc(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleWeek(i,cb) { completedWeeks[i]=cb.checked; localStorage.setItem('ege_completed_weeks',JSON.stringify(completedWeeks)); updateProgress(); }
function updateProgress() {
  const total=rawExcelPlan.length, done=Object.values(completedWeeks).filter(Boolean).length;
  document.getElementById('progress-text').textContent=`${done} / ${total} недель`;
  document.getElementById('progress-bar').style.width=`${total ? done/total*100 : 0}%`;
}

function extractYoutube(s) {
  const m=(s||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]+)/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : '';
}
function openVideo(i) {
  currentVideoWeek=i;
  document.getElementById('modalVideoTitle').textContent=rawExcelPlan[i].period;
  document.getElementById('videoModal').style.display='flex';
  playYouTube();
}
function playYouTube() {
  const url=extractYoutube(rawExcelPlan[currentVideoWeek]?.yt);
  document.getElementById('videoWrap').innerHTML=url
    ? `<iframe src="${url}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center">Для этой недели видео не задано в таблице.</div>';
}
function saveLocalVideo(e) {
  const f=e.target.files?.[0]; if(!f || currentVideoWeek===null) return;
  const reader=new FileReader();
  reader.onload=ev=>{localVideos[currentVideoWeek]=ev.target.result;localStorage.setItem('ege_local_videos',JSON.stringify(localVideos));};
  reader.readAsDataURL(f);
}
function closeVideoModal() { document.getElementById('videoModal').style.display='none'; document.getElementById('videoWrap').innerHTML=''; }

function buildQuestionBank(){
  const bank={};
  for(let n=1;n<=26;n++){
    const base=pools[n]||[]; bank[n]=[];
    for(let i=0;i<30;i++){
      const src=base[i%base.length];
      const q=src[0]+(i>=base.length?` Вариант ${i+1}.`:''), opts=src.slice(1);
      const answer=opts[0];
      const shuffled=[...opts].sort(()=>Math.random()-.5);
      bank[n].push({id:`${n}-${i+1}`,question:q,options:shuffled,answer,explanation:`Правильный ответ: «${answer}». Тема: ${taskTopics[n]}.`});
    }
  }
  return bank;
}
const questionBank=buildQuestionBank();
let quizState=null;
function renderTrainer(){
  const el=document.getElementById('trainer-tasks');
  el.innerHTML=Array.from({length:26},(_,i)=>`<button class="task-btn" onclick="startQuiz(${i+1})"><b>№${i+1}</b><span>${esc(taskTopics[i+1])}</span><span>30 вопросов</span></button>`).join('');
}
function startQuiz(task){
  quizState={task,index:0,answers:Array(30).fill(null),questions:questionBank[task],finished:false};
  document.getElementById('trainer-tasks').parentElement.style.display='none';
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('quiz-result').style.display='none';
  renderQuestion();
}
function renderQuestion(){
  const q=quizState.questions[quizState.index], chosen=quizState.answers[quizState.index];
  document.getElementById('quiz-title').textContent=`Задание №${quizState.task} — ${taskTopics[quizState.task]}`;
  document.getElementById('quiz-progress').textContent=`Вопрос ${quizState.index+1} из 30`;
  document.getElementById('quiz-progress-bar').style.width=((quizState.index+1)/30*100)+'%';
  document.getElementById('quiz-question').innerHTML=`<div class="q-title">${esc(q.question)}</div>${q.options.map((o,i)=>`<label class="q-option ${chosen===o?'selected':''}"><input type="radio" name="q" ${chosen===o?'checked':''} onchange="chooseAnswer(${JSON.stringify(o).replace(/</g,'\\u003c')})">${esc(o)}</label>`).join('')}`;
  document.getElementById('next-btn').textContent=quizState.index===29?'Завершить тест':'Далее →';
}
function chooseAnswer(v){quizState.answers[quizState.index]=v;renderQuestion();}
function nextQuestion(){if(quizState.index===29){finishQuiz();return;}quizState.index++;renderQuestion();}
function prevQuestion(){if(quizState.index>0){quizState.index--;renderQuestion();}}
function finishQuiz(){
  const score=quizState.questions.reduce((s,q,i)=>s+(quizState.answers[i]===q.answer?1:0),0);
  quizState.finished=true;
  testHistory.unshift({date:new Date().toLocaleDateString('ru-RU'),title:`Тренажёр №${quizState.task}`,score:`${score}/30`,task:quizState.task});
  testHistory=testHistory.slice(0,50);localStorage.setItem('ege_test_history',JSON.stringify(testHistory));
  const r=document.getElementById('quiz-result');r.style.display='block';
  r.innerHTML=`<h3>Результат: ${score}/30</h3><div class="result-score">${score} / 30</div><p class="notice">Теперь доступны правильные ответы и объяснения. Ошибки отмечены ниже.</p>${quizState.questions.map((q,i)=>{const ok=quizState.answers[i]===q.answer;return `<div class="answer-review ${ok?'ok':'bad'}"><b>${i+1}. ${ok?'✓ Верно':'✗ Ошибка'}</b><div>${esc(q.question)}</div><div>Ваш ответ: ${esc(quizState.answers[i]??'нет ответа')}</div><div>Правильно: ${esc(q.answer)}</div><div class="muted">${esc(q.explanation)}</div></div>`}).join('')}`;
  document.getElementById('quiz-card').style.display='none';renderHistory();
}
function exitQuiz(){quizState=null;document.getElementById('quiz-card').style.display='none';document.getElementById('quiz-result').style.display='none';document.getElementById('trainer-tasks').parentElement.style.display='block';renderTrainer();}
function renderFipi() {
  document.getElementById('fipi-list').innerHTML=fipiIds.map((id,i)=>`
    <div class="task-item">
      <span class="source-badge">ФИПИ • реальный ID</span>
      <div class="task-title">Тренировочное задание №${i+1} — ${esc(id)}</div>
      <div class="task-desc">ID из навигатора самостоятельной подготовки ФИПИ-2026. Открывайте через официальный банк.</div>
      <a class="btn-small" href="${fipiBankUrl}" target="_blank">Открыть банк ФИПИ</a>
    </div>`).join('');
}
function renderRoutine() {
  document.getElementById('routine-list').innerHTML=routineData.map(r=>`
    <div class="routine-row"><b>${esc(r.day)}:</b> ${esc(r.action)} (${esc(r.time)}) — <i>${esc(r.res)}</i></div>`).join('');
}
function renderHistory() {
  const el=document.getElementById('history-list');
  if(!testHistory.length) {el.textContent='Пока нет пройденных тестов.';return;}
  el.innerHTML=testHistory.map(h=>`
    <div class="routine-row"><b>${esc(h.title)}</b> — ${esc(h.date)}${h.score!==null&&h.score!==undefined?' — Балл: '+esc(h.score):' — открыт источник'}</div>`).join('');
}

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
